# Land-App backend — rendered to /etc/nginx/sites-available/land-app
# by scripts/setup-server.sh (placeholders __LAND_DOMAIN__ / __APP_PORT__).
# The existing pagalpagal site stays the default_server on port 80.

map $http_upgrade $connection_upgrade_land {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __LAND_DOMAIN__;

    client_max_body_size 12m;

    gzip on;
    gzip_types application/json text/plain;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_land;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
